base_url: "http://127.0.0.1:8000"
endpoint: "/v1/completions"
model: ""                 # empty means query the served name from /v1/models
tokenizer: "Qwen/Qwen3-8B"
use_token_ids: true

# workload buckets spanning short chat to long context
# The largest request is 8192 input + 512 output = 8704 total tokens, so vLLM
# must be launched with --max-model-len/ MAXLEN of at least 8704.
buckets:
  - {input_len: 128,  output_len: 128, weight: 1.0}
  - {input_len: 1024, output_len: 256, weight: 1.0}
  - {input_len: 4096, output_len: 256, weight: 1.0}
  - {input_len: 8192, output_len: 512, weight: 0.5}
seed: 1234

mode: "closed"            # closed for fixed concurrency, open for Poisson arrivals
concurrency: 16
qps: 4.0
max_inflight: 512
# This workload is long-context: at high concurrency a single request's e2e is
# tens to hundreds of seconds, so a short warmup opens the measurement window
# mid-transient (concurrency ramped but nothing completed, KV still filling),
# which biases the completed-in-window aggregates toward prefill. Warm long
# enough for requests_running and KV to plateau before measuring.
warmup_s: 120.0
measure_s: 600.0
# Must comfortably exceed the worst-case e2e (queueing + full stream) at the
# highest concurrency in the sweep, or slow-but-successful requests are
# recorded as timeout failures. Keep it well above measure_s.
request_timeout_s: 1800.0

# service level objective used for goodput. Two ITL tiers are scored against the
# same TTFT bound: itl_slo_s is the strict interactive target (10 tok/s/stream),
# itl_slo_s2 a looser tier. On bandwidth-bound GB10 the dense 32B/70B models
# floor above 0.10s ITL even unloaded, so their strict goodput is ~0; the looser
# tier separates them under load. goodput_rps uses itl_slo_s, goodput_itl2_rps
# uses itl_slo_s2.
ttft_slo_s: 3.0
itl_slo_s: 0.10
itl_slo_s2: 0.20

power_backend: "nvidia_smi"     # none, nvidia_smi, sysfs, tegrastats
power_sysfs_path: ""
power_rails: []
power_interval_ms: 100
scrape_vllm_metrics: true

config_label: "single"
collect_hf_metadata: false
out_dir: "results"
run_note: ""
