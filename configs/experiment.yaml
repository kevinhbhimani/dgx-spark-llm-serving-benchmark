base_url: "http://127.0.0.1:8000"
endpoint: "/v1/completions"
model: ""                 # empty means query the served name from /v1/models
tokenizer: "Qwen/Qwen3-8B"
use_token_ids: true

# Workload buckets span short and long prompts.
# The largest request is 8192 input + 512 output = 8704 total tokens, so vLLM
# must be launched with --max-model-len/ MAXLEN of at least 8704.
buckets:
  - {input_len: 128,  output_len: 128, weight: 1.0}
  - {input_len: 1024, output_len: 256, weight: 1.0}
  - {input_len: 4096, output_len: 256, weight: 1.0}
  - {input_len: 8192, output_len: 512, weight: 0.5}
seed: 1234
# Smooth weighted round-robin scheduling keeps short request slices close to
# the configured bucket proportions.
balanced_workload: true

mode: "closed"            # closed for fixed concurrency, open for Poisson arrivals
concurrency: 16
qps: 4.0
max_inflight: 512
# Warmup, measurement, and cooldown run in one continuous load phase.
# In closed-loop mode, measurement starts after warmup and completion of every
# worker's initial request. After minimum cooldown, replacement load continues
# until all requests started during measurement finish. Remaining replacement
# requests then drain. The summary records warmup_extension_s,
# load_extension_s, and drain_s.
warmup_s: 120.0
# Each point uses three independent launches in run_job.sh. measure_s is the
# minimum measurement window. The closed-loop request-count rule extends the
# window in window_extension_step_s increments until min_window_requests is
# reached or max_measure_s is reached. The campaign records three repeat rows.
measure_s: 600.0
min_window_requests: 20
window_extension_step_s: 60.0
max_measure_s: 3600.0
cooldown_s: 30.0
# Must comfortably exceed the worst-case e2e (queueing + full stream) at the
# highest concurrency in the sweep, or slow-but-successful requests are
# recorded as timeout failures.
request_timeout_s: 14400.0

# Goodput uses the same TTFT bound with two ITL bounds. goodput_rps uses
# itl_slo_s. goodput_itl2_rps uses itl_slo_s2.
ttft_slo_s: 3.0
itl_slo_s: 0.10
itl_slo_s2: 0.20

power_backend: "nvidia_smi"     # none, nvidia_smi, sysfs, tegrastats
power_sysfs_path: ""
power_rails: []
power_interval_ms: 100
scrape_vllm_metrics: true
# Required power and vLLM metric coverage gates publication.
require_power_data: true
require_vllm_metrics_data: true
# Published rows require exact Hugging Face commits and a complete serving policy.
require_provenance: true
# Publication and resume reject request or stream failures. Each point requires
# the configured minimum number of successful requests.
require_zero_request_failures: true
min_successful_requests: 20

config_label: "single"
collect_hf_metadata: false
run_note: ""
