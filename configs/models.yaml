    label: llama3.1-8b
    revision: 0e9e39f249a16976918f6564b8830bc894c89659
    configs: [single, tp2, pp2]
    max_model_len: 8704
    meta: {pretty: "Llama-3.1-8B", arch: dense, attention: full, quant: bf16, params_b: 8.0, active_b: 8.0, ladder_base: llama3.1-8b, nvidia: false}

