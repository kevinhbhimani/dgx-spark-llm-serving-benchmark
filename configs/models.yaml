  # Same labels and revisions as the PMBS26 TCP baseline. FP8 and NVFP4 are
  # NVIDIA ModelOpt checkpoints of the same base (FP8 KV cache); the base repo
  # is gated, so the campaign HF_TOKEN must have accepted the Llama license.
  - name: meta-llama/Llama-3.1-8B-Instruct            # 16.1 GB BF16
    label: llama3.1-8b
    revision: 0e9e39f249a16976918f6564b8830bc894c89659
    configs: [single, tp2, pp2]
    max_model_len: 8704

  - name: nvidia/Llama-3.1-8B-Instruct-FP8            # 9.1 GB
