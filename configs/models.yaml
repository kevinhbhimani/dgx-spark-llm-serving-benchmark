# Model matrix for the RDMA campaign (methodology steady-exact-v4).
#
# scripts/run_job.sh walks this list IN ORDER, one model at a time:
#   download the pinned snapshot -> mirror it to the worker -> measure every
#   listed serving config with interleaved replicates -> delete the weights
#   from both nodes' caches.
# Peak cache use is therefore the largest single entry (~163 GB), not the
# whole matrix (~1.44 TB). The new matrix (entries 1-10) comes first, cheapest
# first, so a broken pipeline shows up on the 8B ladder within hours and that
# ladder overlaps the PMBS26 TCP baseline (baselines/pmbs26-tcp) for an early
# transport comparison. The RDMA-pilot carry-overs (11-13) run last.
#
# Per-model fields:
#   name          Hugging Face model id served by vLLM (required).
#   label         short slug used in run tags, index rows, and plots (required).
#   configs       serving configs to benchmark: any of [single, tp2, pp2].
#   revision      exact 40-hex HF commit (required).
#   max_model_len passed to vLLM --max-model-len; must be >= the largest
#                 input_len + output_len in the workload (8192 + 512).
#   gpu_util      optional --gpu-memory-utilization (launcher default 0.80).
#                 Keep it IDENTICAL across a model's configs, or the KV budget
#                 confounds the single/tp2/pp2 comparison.
#   quant         optional --quantization for on-the-fly quantization. Leave
#                 unset for pre-quantized checkpoints (ModelOpt FP8/NVFP4,
#                 Qwen FP8, MXFP4): vLLM auto-detects the method.
#   tokenizer     optional tokenizer id/path (defaults to name).
#   trust_remote_code  true only for repos that ship custom modeling code.
#
# Every revision below was pinned on 2026-10-15. Weight sizes are the exact
# download sizes of the pinned snapshot (excluding original/ and metal/
# duplicates). "single" appears only where weights + KV fit one GB10 at 0.80.
#
# KV-cache precision is NOT uniform along the precision ladders, and the paper
# must say so: NVIDIA ModelOpt checkpoints (all *-NVFP4, nvidia/*-FP8) ship an
# FP8 KV cache (kv_cache_quant_algo=FP8) that vLLM applies automatically, while
# BF16 checkpoints and Qwen's own FP8 checkpoints keep a BF16 KV cache. The
# index records the served kv_cache_dtype per row.
#
# vLLM version: several model cards validate on vLLM >= 0.20 (Gemma 4 26B),
# 0.21 (Mistral Medium 3.5), nightly (Qwen3.6 NVFP4), and 0.27.1 (Nemotron 3.5
# Lightning). The image in scripts/connectx_env.sh was therefore moved from NGC
# 26.04 (vLLM 0.19.0) to 26.09 (vLLM 0.29.0). Run the canary pass before the
# campaign; it launches every entry under every config it lists.

models:
