# Model matrix for the multi-model sweep (scripts/run_models.sh).
#
# Each entry is benchmarked under the serving configs it lists. run_models.sh
# takes ONE serving config at a time (single, tp2, or pp2), selects the models
# that request it, and for each one launches a server, waits for it to be ready,
# runs the concurrency sweep tagged with the model label, then tears the server
# down before the next model. Results land in index.csv tagged by model_label so
# plot_results.py can compare across models.
#
# Per-model fields:
#   name          Hugging Face model id served by vLLM (required).
#   label         short slug used in run tags, index rows, and plots (required).
#   configs       serving configs to benchmark: any of [single, tp2, pp2].
#   max_model_len passed to vLLM --max-model-len and used to size the workload;
#                 must be >= the largest input_len + output_len in the workload.
#   gpu_util      optional --gpu-memory-utilization override (else the launcher
#                 default: 0.90 single, 0.80 tp2/pp2 on Grace unified memory).
#   quant         optional --quantization (e.g. fp8); empty means none.
#   tokenizer     optional tokenizer id/path (defaults to name).
#   trust_remote_code  set true for models that ship custom modeling code
#                 (e.g. NVIDIA Nemotron); passes vLLM --trust-remote-code.
#
# "single" serves on one GB10. A model whose weights + KV cache do not fit in one
# node's budget must omit "single" and use tp2/pp2, which pool two nodes (~2x
# memory) over the ConnectX link. Weight footprint ~= params * dtype_bytes; a
# 70B model in bf16 (~140 GB) exceeds one 128 GB node and is dual-only.
#
# This matrix keeps the paper/runtime focused: neutral open baselines plus
# NVIDIA/Nemotron optimized models for the hardware-specific story. The default
# workload's largest bucket is 8192 input + 512 output => max_model_len 8704.

models:
  # Baseline dense 8B.
  - name: Qwen/Qwen3-8B
    label: qwen3-8b
    configs: [single, tp2]
    max_model_len: 8704

  # Dense 32B reference.
  - name: Qwen/Qwen3-32B
    label: qwen3-32b
    configs: [single, tp2, pp2]
    max_model_len: 8704
    gpu_util: 0.85

  # BF16 MoE counterpart to Qwen3-32B.
  - name: Qwen/Qwen3-30B-A3B
    label: qwen3-30b-a3b
    configs: [single, tp2]
    max_model_len: 8704
    gpu_util: 0.85

  # Large dense model.
  # BF16 exceeds a single GB10 (~140 GB weights), so benchmark only on two nodes.
  - name: meta-llama/Llama-3.3-70B-Instruct
    label: llama3.3-70b
    configs: [tp2, pp2]
    max_model_len: 8704

  # Same model in FP8 (fits on one GB10).
  - name: meta-llama/Llama-3.3-70B-Instruct
    label: llama3.3-70b-fp8
    configs: [single, tp2, pp2]
    max_model_len: 8704
    quant: fp8
    gpu_util: 0.85

  # Same model in NVFP4 (comfortably fits on one GB10).
  - name: meta-llama/Llama-3.3-70B-Instruct
    label: llama3.3-70b-nvfp4
    configs: [single, tp2, pp2]
    max_model_len: 8704
    quant: nvfp4
    gpu_util: 0.90

  # NVIDIA-optimized sparse model.
  - name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
    label: nemotron3-nano-30b-a3b-nvfp4
    configs: [single, tp2]
    max_model_len: 8704
    quant: nvfp4
    trust_remote_code: true

  # Multimodal baseline.
  - name: Qwen/Qwen3-VL-8B-Instruct
    label: qwen3-vl-8b
    configs: [single, tp2]
    max_model_len: 8704

  # NVIDIA flagship LatentMoE.
  - name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    label: nemotron3-super-120b-a12b-nvfp4
    configs: [single, tp2]
    max_model_len: 8704
    quant: nvfp4
    gpu_util: 0.80
    trust_remote_code: true

  # ------------------------------------------------------------------
  # Large open multimodal models, dual node only.
  # Added to evaluate on-prem VLM options for UD researchers. Both exceed a
  # single 128 GB GB10 at BF16, so they run only across two nodes.
  # NOTE: the default workload is text only. These entries measure the text
  # generation serving path at scale. To exercise the vision encoder, drive them
  # with an image workload through the OpenAI content format.
  # ------------------------------------------------------------------

  # Dense multimodal workhorse. Image and video input, mature vLLM support.
  # BF16 ~144 GB weights exceeds one node; comfortable on two with KV headroom.
  - name: Qwen/Qwen2.5-VL-72B-Instruct
    label: qwen2.5-vl-72b
    configs: [tp2, pp2]
    max_model_len: 8704
    gpu_util: 0.85

  # Flagship open multimodal MoE, native image input, very long context.
  # 109B total, 17B active; BF16 ~218 GB needs two nodes and is tight in the
  # 256 GB pool, so utilization is raised and KV room is limited. For one node
  # production use, an FP8 checkpoint fits a single GB10.
  - name: meta-llama/Llama-4-Scout-17B-16E-Instruct
    label: llama4-scout-17b-16e
    configs: [tp2, pp2]
    max_model_len: 8704
    gpu_util: 0.92