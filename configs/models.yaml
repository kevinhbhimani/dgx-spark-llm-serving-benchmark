# Model matrix for the RDMA NVFP4/BF16 precision ladder campaign.
# See rdma-testing/docs/nvfp4-bf16-models.md for the full analysis.
#
# Each entry is benchmarked under the serving configs it lists. run_models.sh
# takes ONE serving config at a time (single, tp2, or pp2), selects the models
# that request it, and for each one launches a server, waits for it to be ready,
# runs the concurrency sweep tagged with the model label, then tears the server
# down before the next model. Results land in index.csv tagged by model_label so
# plot_results.py can compare across models.
#
# Per-model fields:
#   name          Hugging Face model id served by vLLM (required).
#   label         short slug used in run tags, index rows, and plots (required).
#   configs       serving configs to benchmark: any of [single, tp2, pp2].
#   max_model_len passed to vLLM --max-model-len and used to size the workload;
#                 must be >= the largest input_len + output_len in the workload.
#   gpu_util      optional --gpu-memory-utilization override (launcher default
#                 0.80). Keep it IDENTICAL across a model's configs.
#   quant         optional --quantization for on-the-fly quantization of an
#                 unquantized checkpoint (e.g. fp8). Leave unset for checkpoints
#                 that are already quantized (NVFP4/ModelOpt): vLLM auto-detects
#                 the method from the model config.
#   tokenizer     optional tokenizer id/path (defaults to name).
#   trust_remote_code  set true for models that ship custom modeling code
#                 (e.g. NVIDIA Nemotron); passes vLLM --trust-remote-code.
#
# "single" serves on one GB10. A model whose weights + KV cache do not fit in one
# node's budget must omit "single" and use tp2/pp2, which pool two nodes (~2x
# memory) over the ConnectX link.
#
# tp2/pp2 prerequisite: the worker node (Hoedus) serves from its LOCAL HF cache
# and has no DNS to huggingface.co. Before a dual-node sweep, warm the head with
# scripts/predownload.sh and mirror to the worker with
# scripts/mirror_worker_cache.sh.
#
# Total download: ~547 GB across 6 models (3 NVFP4/BF16 pairs).
# The default workload's largest bucket is 8192 input + 512 output =>
# max_model_len 8704.

models:
  # ---- RDMA NVFP4/BF16 precision ladder (see rdma-testing/docs/nvfp4-bf16-models.md) ----
  # Each model appears as a pre-quantized NVFP4 checkpoint (auto-detected, no
  # quant field) and as a BF16 base repo. NVFP4-only models without a BF16 repo
  # are excluded to keep the total download under 600 GB. All models use custom
  # architectures and require --trust-remote-code.
  #
  # KV cache: NVFP4 checkpoints carry kv_cache_quant_algo in hf_quant_config.json
  # (FP8 for NVIDIA ModelOpt artifacts). vLLM auto-applies it. BF16 entries use
  # unquantized BF16 KV cache. The existing Llama-3.1-8B ladder has the same split.
  #
  # Revisions pinned to HEAD of each repo as of 2026-10-08.

  # Dense 49B. NVFP4 (31.1 GB) and BF16 (99.8 GB) both fit one node.
  # Arch: DeciLMForCausalLM. NAS heterogeneous blocks produce uneven PP splits.
  - name: nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4
    label: nemotron-super-49b-nvfp4
    revision: f0caaafd5152e07527c7a14e04aa67823107529f
    configs: [single, tp2, pp2]
    max_model_len: 8704
    trust_remote_code: true

  - name: nvidia/Llama-3_3-Nemotron-Super-49B-v1_5
    label: nemotron-super-49b-bf16
    revision: 420ba7d28211abf116b8b103ab700d92619daf98
    configs: [single, tp2, pp2]
    max_model_len: 8704
    trust_remote_code: true

  # MoE 75B (9B active). NVFP4 (53.5 GB) fits one node; BF16 (156.6 GB) needs two.
  # Arch: NemotronHPuzzleForCausalLM. Known issue: Nemotron-3-Nano NVFP4 crashes
  # on GB10 during CUDA graph capture unless VLLM_USE_FLASHINFER_MOE_FP4=0;
  # monitor this model for the same symptom.
  - name: nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4
    label: nemotron-puzzle-75b-nvfp4
    revision: 1d370e47fbc56d1019a471c2339663cdbbb5236f
    configs: [single, tp2, pp2]
    max_model_len: 8704
    trust_remote_code: true

  - name: nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-BF16
    label: nemotron-puzzle-75b-bf16
    revision: 8fe5546888e9bd03fdbf52d808adebdfca901b52
    configs: [tp2, pp2]
    max_model_len: 8704
    trust_remote_code: true

  # MoE 80B (3B active). NVFP4 (46.3 GB) fits one node; BF16 (160.0 GB) needs two.
  # Arch: Qwen3NextForCausalLM. Weight sizes are estimated; the BF16 repo
  # publishes no safetensors index metadata.
  - name: nvidia/Qwen3-Next-80B-A3B-Instruct-NVFP4
    label: qwen3-next-80b-nvfp4
    revision: 8fb2682f136cf94d932a498f18cb1e428832a912
    configs: [single, tp2, pp2]
    max_model_len: 8704
    trust_remote_code: true

  - name: Qwen/Qwen3-Next-80B-A3B-Instruct
    label: qwen3-next-80b-bf16
    revision: 9c7f2fbe84465e40164a94cc16cd30b6999b0cc7
    configs: [tp2, pp2]
    max_model_len: 8704
    trust_remote_code: true


