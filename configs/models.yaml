# Model matrix for the multi-model sweep (scripts/run_models.sh).
#
# Each entry is benchmarked under the serving configs it lists. run_models.sh
# takes ONE serving config at a time (single, tp2, or pp2), selects the models
# that request it, and for each one launches a server, waits for it to be ready,
# runs the concurrency sweep tagged with the model label, then tears the server
# down before the next model. Results land in index.csv tagged by model_label so
# plot_results.py can compare across models.
#
# Per-model fields:
#   name          Hugging Face model id served by vLLM (required).
#   label         short slug used in run tags, index rows, and plots (required).
#   configs       serving configs to benchmark: any of [single, tp2, pp2].
#   max_model_len passed to vLLM --max-model-len and used to size the workload;
#                 must be >= the largest input_len + output_len in the workload.
#   gpu_util      optional --gpu-memory-utilization override (launcher default
#                 0.80). Keep it IDENTICAL across a model's configs: the
#                 single-vs-tp2-vs-pp2 comparison is the paper's axis, and a
#                 different KV budget per config confounds exactly the
#                 high-concurrency behavior being compared. The old matrix
#                 mixed 0.90 single / 0.80 dual for several models.
#   quant         optional --quantization for on-the-fly quantization of an
#                 unquantized checkpoint (e.g. fp8). Leave unset for checkpoints
#                 that are already quantized (NVFP4/ModelOpt): vLLM auto-detects
#                 the method from the model config, and passing --quantization
#                 can conflict with the config's own naming and abort the launch.
#   tokenizer     optional tokenizer id/path (defaults to name).
#   trust_remote_code  set true for models that ship custom modeling code
#                 (e.g. NVIDIA Nemotron); passes vLLM --trust-remote-code.
#
# "single" serves on one GB10. A model whose weights + KV cache do not fit in one
# node's budget must omit "single" and use tp2/pp2, which pool two nodes (~2x
# memory) over the ConnectX link. Weight footprint ~= params * dtype_bytes; a
# 70B model in bf16 (~140 GB) exceeds one 128 GB node and is dual-only.
#
# tp2/pp2 prerequisite: the worker node (Hoedus) serves from its LOCAL HF cache
# and has no DNS to huggingface.co. Before a dual-node sweep, warm the head with
# scripts/predownload.sh and mirror to the worker with
# scripts/mirror_worker_cache.sh, or every model missing there dies at launch.
#
# This matrix keeps the paper/runtime focused: neutral open baselines plus
# NVIDIA/Nemotron optimized models for the hardware-specific story. Every model
# that can run pp2 lists it, so the TP-vs-PP comparison is a claim across model
# classes rather than an anecdote from one or two models. The default workload's
# largest bucket is 8192 input + 512 output => max_model_len 8704.

models:
  # Baseline dense 8B.
  - name: Qwen/Qwen3-8B
    label: qwen3-8b
    configs: [single, tp2, pp2]
    max_model_len: 8704

  # Dense 32B reference.
  - name: Qwen/Qwen3-32B
    label: qwen3-32b
    configs: [single, tp2, pp2]
    max_model_len: 8704

  # BF16 MoE counterpart to Qwen3-32B.
  - name: Qwen/Qwen3-30B-A3B
    label: qwen3-30b-a3b
    configs: [single, tp2, pp2]
    max_model_len: 8704

  # Large dense model.
  # BF16 exceeds a single GB10 (~140 GB weights), so benchmark only on two nodes.
  - name: meta-llama/Llama-3.3-70B-Instruct
    label: llama3.3-70b
    configs: [tp2, pp2]
    max_model_len: 8704

  # Same model in FP8 (fits on one GB10). Completes the bf16/fp8/nvfp4
  # quantization ladder on the same weights.
  - name: meta-llama/Llama-3.3-70B-Instruct
    label: llama3.3-70b-fp8
    configs: [single, tp2, pp2]
    max_model_len: 8704
    quant: fp8

  # Same model in NVFP4 (comfortably fits on one GB10). Uses NVIDIA's
  # pre-quantized ModelOpt checkpoint (ungated): vLLM cannot quantize to NVFP4
  # on the fly from the BF16 meta-llama weights, and it auto-detects the
  # quantization method from this checkpoint's config, so no quant field.
  - name: nvidia/Llama-3.3-70B-Instruct-NVFP4
    label: llama3.3-70b-nvfp4
    configs: [single, tp2, pp2]
    max_model_len: 8704

  # NVIDIA-optimized sparse model. Pre-quantized NVFP4 checkpoint: the config
  # declares its method as modelopt_fp4, so passing --quantization nvfp4 aborts
  # the launch with a method mismatch; let vLLM auto-detect instead.
  # pp2 is speculative for the hybrid (mamba) architecture; if vLLM refuses the
  # pipeline split, run_models.sh logs the failure and moves on.
  - name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
    label: nemotron3-nano-30b-a3b-nvfp4
    configs: [single, tp2, pp2]
    max_model_len: 8704
    trust_remote_code: true

  # NVIDIA flagship LatentMoE. Pre-quantized NVFP4 checkpoint; no quant field
  # (auto-detected, see the nano entry above). pp2 speculative as for the nano.
  - name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    label: nemotron3-super-120b-a12b-nvfp4
    configs: [single, tp2, pp2]
    max_model_len: 8704
    trust_remote_code: true

  # ------------------------------------------------------------------
  # Cut from the paper matrix. Re-enable by uncommenting.
  # ------------------------------------------------------------------

  # Qwen3-VL-8B on the text-only workload reproduced Qwen3-8B within noise
  # across the whole sweep (identical text backbone), so it spends a model slot
  # saying nothing. Re-add it only together with an image workload that
  # actually exercises the vision encoder.
  # - name: Qwen/Qwen3-VL-8B-Instruct
  #   label: qwen3-vl-8b
  #   configs: [single, tp2]
  #   max_model_len: 8704

  # Large open multimodal models for UD researchers' on-prem VLM evaluation;
  # never yet benchmarked, not part of the PMBS matrix, and each adds ~5h per
  # dual-node config. The default workload is text-only, so these would measure
  # the text path at scale anyway. Note llama4-scout previously needed
  # gpu_util 0.88 to fit at all, which breaks the uniform-0.80 comparison
  # policy; treat any run of it as a capability demo, not a comparable point.
  # - name: Qwen/Qwen2.5-VL-72B-Instruct
  #   label: qwen2.5-vl-72b
  #   configs: [tp2, pp2]
  #   max_model_len: 8704
  # - name: meta-llama/Llama-4-Scout-17B-16E-Instruct
  #   label: llama4-scout-17b-16e
  #   configs: [tp2, pp2]
  #   max_model_len: 8704
  #   gpu_util: 0.88
