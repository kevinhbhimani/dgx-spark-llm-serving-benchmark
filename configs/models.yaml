# Model matrix for the multi-model sweep (scripts/run_models.sh).
#
# Each entry is benchmarked under the serving configs it lists. run_models.sh
# takes ONE serving config at a time (single, tp2, or pp2), selects the models
# that request it, and for each one launches a server, waits for it to be ready,
# runs the concurrency sweep tagged with the model label, then tears the server
# down before the next model. Results land in index.csv tagged by model_label so
# plot_results.py can compare across models.
#
# Per-model fields:
#   name          Hugging Face model id served by vLLM (required).
#   label         short slug used in run tags, index rows, and plots (required).
#   configs       serving configs to benchmark: any of [single, tp2, pp2].
#   max_model_len passed to vLLM --max-model-len and used to size the workload;
#                 must be >= the largest input_len + output_len in the workload.
#   gpu_util      optional --gpu-memory-utilization override (else the launcher
#                 default: 0.90 single, 0.80 tp2/pp2 on Grace unified memory).
#   quant         optional --quantization (e.g. fp8); empty means none.
#   tokenizer     optional tokenizer id/path (defaults to name).
#
# "single" serves on one GB10. A model whose weights + KV cache do not fit in one
# node's budget must omit "single" and use tp2/pp2, which pool two nodes (~2x
# memory) over the ConnectX link. Weight footprint ~= params * dtype_bytes; a
# 70B model in bf16 (~140 GB) exceeds one 128 GB node and is dual-only.
#
# This matrix keeps the paper/runtime focused: neutral open baselines plus
# NVIDIA/Nemotron optimized models for the hardware-specific story. The default
# workload's largest bucket is 8192 input + 512 output => max_model_len 8704.

models:
  # Small neutral baseline: shows one-Spark serving behavior for a common Llama.
  - name: meta-llama/Llama-3.1-8B-Instruct
    label: llama3.1-8b
    configs: [single, tp2]
    max_model_len: 8704

  # NVIDIA-tuned 8B counterpart to the Llama baseline.
  - name: nvidia/Llama-3.1-Nemotron-Nano-8B-v1
    label: nemotron-nano-8b
    configs: [single, tp2]
    max_model_len: 8704

  # Strong non-Llama mid-size baseline with long-context capability.
  - name: google/gemma-3-27b-it
    label: gemma3-27b
    configs: [single, tp2]
    max_model_len: 8704

  # Strong dense open model that stresses one Spark while still fitting.
  - name: Qwen/Qwen3-32B
    label: qwen3-32b
    configs: [single, tp2, pp2]
    max_model_len: 8704
    gpu_util: 0.85

  # NVIDIA FP8 MoE model: important for the "optimized for NVIDIA" local path.
  - name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
    label: nemotron3-nano-30b-a3b-fp8
    configs: [single, tp2]
    max_model_len: 8704
    quant: fp8

  # NVIDIA NAS-optimized 49B model derived from Llama 3.3 70B.
  - name: nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-FP8
    label: nemotron-super-49b-fp8
    configs: [single, tp2, pp2]
    max_model_len: 8704
    quant: fp8

  # Too big for one GB10 (bf16 ~140 GB > 128 GB): dual-node only.
  - name: meta-llama/Llama-3.3-70B-Instruct
    label: llama3.3-70b
    configs: [tp2, pp2]
    max_model_len: 8704
